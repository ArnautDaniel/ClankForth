# The language's tests: gcc and clang, each a plain build and one with the address and undefined-behaviour
# sanitizers; a warning stops the build. Built with what the runner has (cmake's own generator): nothing is
# installed first, so a run doesn't hang on the package mirrors being reachable. (The hosts' suites need their own
# libraries and the games' data: they are run where those are, with tools/check-hosts.sh.)
name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        flags: ["", "-fsanitize=address,undefined -fno-sanitize-recover=undefined"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCLANKFORTH_WERROR=ON
          -DCMAKE_C_FLAGS="${{ matrix.flags }}" && cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cd build && ctest --output-on-failure

  # the fuzzer builds and runs (tests/fuzz_eval.c): the tests' files as its inputs, once each. Fuzzing itself is
  # done by hand: what it finds needs reading (a number used as an address far from any is the language's).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DCLANKFORTH_FUZZ=ON && cmake --build build-fuzz --parallel
      - name: The tests as inputs
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: build-fuzz/fuzz_eval tests/test_*.fs lib/*.fs
