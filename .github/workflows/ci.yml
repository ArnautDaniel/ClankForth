# The language's tests: gcc and clang, each a plain build and one with the address and undefined-behaviour
# sanitizers; a warning stops the build. Built with what the runner has (cmake's own generator): nothing is
# installed first, so a run doesn't hang on the package mirrors being reachable. (The hosts' suites need their own
# libraries and the games' data: they are run where those are, with tools/check-hosts.sh.)
name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        flags: ["", "-fsanitize=address,undefined -fno-sanitize-recover=undefined"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCLANKFORTH_WERROR=ON
          -DCMAKE_C_FLAGS="${{ matrix.flags }}" && cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cd build && ctest --output-on-failure

  # Windows with MinGW (the runner's gcc): the native backend's other calling convention, tasks' stacks as fibers
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCLANKFORTH_WERROR=ON
          && cmake --build build --parallel
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # the system without its stack checker (CLANKFORTH_CHECKER=OFF): it builds, and the tests that aren't the checker's
  # pass (each file ends at `checker-tests` there)
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DCLANKFORTH_CHECKER=OFF -DCLANKFORTH_WERROR=ON && cmake --build build --parallel
      - name: Test
        run: cd build && ctest --output-on-failure

  # the fuzzer builds and runs (tests/fuzz_eval.c): the tests' files as its inputs, once each. Fuzzing itself is
  # done by hand: what it finds needs reading (a number used as an address far from any is the language's).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DCLANKFORTH_FUZZ=ON && cmake --build build-fuzz --parallel
      - name: The tests as inputs
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: build-fuzz/fuzz_eval tests/test_*.fs core/*.fs $(find basis -name "*.fs")

  # sql: the SQL Server client against a real server - SQL Server 2022 in a container, its certificate a test's own
  # (localhost), trusted by the client: TLS first (TDS 8.0, strict), then once plain. The image is pulled from
  # Microsoft's registry; a run that can't reach it fails here, not in the language's tests.
  sql:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: "Clank-Forth-CI-2026!"   # (a throwaway server's, in this job only)
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DCLANKFORTH_WERROR=ON && cmake --build build --parallel
      - name: A certificate for the server
        run: |
          mkdir -p /tmp/mssql && cd /tmp/mssql
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" -keyout key.pem -out cert.pem
          chmod 755 /tmp/mssql && chmod 644 key.pem cert.pem
          printf '[network]\ntlscert = /certs/cert.pem\ntlskey = /certs/key.pem\ntlsprotocols = 1.2\nforceencryption = 0\n' > mssql.conf
      - name: SQL Server
        run: |
          docker run -d --name sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 1433:1433 \
            -v /tmp/mssql:/certs -v /tmp/mssql/mssql.conf:/var/opt/mssql/mssql.conf \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C \
            -Q "CREATE DATABASE stagingdb; CREATE DATABASE proddb"
      - name: The client, TLS first
        env:
          SQL_HOST: localhost
          SQL_USER: sa
          SQL_DATABASE: stagingdb
          SQL_OTHER: proddb
          SQL_CA: /tmp/mssql/cert.pem
        run: SQL_PASSWORD="$SA_PASSWORD" build/clankforth $PWD/tests/sql/live.fs
      - name: The client, plain
        env:
          SQL_HOST: localhost
          SQL_USER: sa
          SQL_DATABASE: stagingdb
          SQL_OTHER: proddb
          SQL_PLAIN: "1"
        run: SQL_PASSWORD="$SA_PASSWORD" build/clankforth $PWD/tests/sql/live.fs
      - name: The server's log, if a step failed
        if: failure()
        run: docker logs sql | tail -50
