# The language's tests: gcc and clang, each a plain build and one with the address and undefined-behaviour
# sanitizers; a warning stops the build. Built with what the runner has (cmake's own generator): nothing is
# installed first, so a run doesn't hang on the package mirrors being reachable. (The hosts' suites need their own
# libraries and the games' data: they are run where those are, with tools/check-hosts.sh.)
name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        flags: ["", "-fsanitize=address,undefined -fno-sanitize-recover=undefined"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCLANKFORTH_WERROR=ON
          -DCMAKE_C_FLAGS="${{ matrix.flags }}" && cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cd build && ctest --output-on-failure

  # Windows with MinGW (the runner's gcc): the native backend's other calling convention, tasks' stacks as fibers
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCLANKFORTH_WERROR=ON
          && cmake --build build --parallel
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # the system without its stack checker (CLANKFORTH_CHECKER=OFF): it builds, and the tests that aren't the checker's
  # pass (each file ends at `checker-tests` there)
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DCLANKFORTH_CHECKER=OFF -DCLANKFORTH_WERROR=ON && cmake --build build --parallel
      - name: Test
        run: cd build && ctest --output-on-failure

  # the fuzzer builds and runs (tests/fuzz_eval.c): the tests' files as its inputs, once each. Fuzzing itself is
  # done by hand: what it finds needs reading (a number used as an address far from any is the language's).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DCLANKFORTH_FUZZ=ON && cmake --build build-fuzz --parallel
      - name: The tests as inputs
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: build-fuzz/fuzz_eval tests/test_*.fs core/*.fs $(find basis -name "*.fs")

  # sql: the SQL Server client against a real server - SQL Server 2022 in a container: plain (the gate), then TLS
  # first (TDS 8.0, strict) with a test CA's certificate - informational, as the container refuses strict. The image
  # is pulled from Microsoft's registry; a run that can't reach it fails here, not in the language's tests.
  sql:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: "Clank-Forth-CI-2026!"   # (a throwaway server's, in this job only)
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DCLANKFORTH_WERROR=ON && cmake --build build --parallel
      - name: Certificates - a test CA, and the server's signed by it
        # (strict - TDS 8.0 - wants a server certificate proper: for server authentication, naming the host)
        run: |
          mkdir -p /tmp/mssql && cd /tmp/mssql
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=clankforth test CA" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign" -keyout ca-key.pem -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=sqlhost" -keyout key.pem -out server.csr
          printf 'basicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=DNS:sqlhost,DNS:localhost\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem -CAcreateserial -days 2 -extfile server.ext -out cert.pem
          chmod 755 /tmp/mssql && chmod 644 key.pem cert.pem ca.pem
          printf '[network]\ntlscert = /certs/cert.pem\ntlskey = /certs/key.pem\ntlsprotocols = 1.2\nforceencryption = 0\n' > mssql.conf
      - name: SQL Server
        run: |
          docker run -d --name sql -h sqlhost -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 1433:1433 \
            -v /tmp/mssql:/certs -v /tmp/mssql/mssql.conf:/var/opt/mssql/mssql.conf \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C \
            -Q "CREATE DATABASE stagingdb; CREATE DATABASE proddb"
      - name: The client, plain
        env:
          SQL_HOST: localhost
          SQL_USER: sa
          SQL_DATABASE: stagingdb
          SQL_OTHER: proddb
          SQL_PLAIN: "1"
        run: SQL_PASSWORD="$SA_PASSWORD" build/clankforth $PWD/tests/sql/live.fs
      - name: The server's TLS-first handshake, as OpenSSL sees it
        if: always()
        run: echo | openssl s_client -connect localhost:1433 -alpn tds/8.0 -CAfile /tmp/mssql/ca.pem -servername localhost 2>&1 | grep -E "Verify|ALPN|Protocol|Cipher|error|CONNECTED" | head -20
      # (SQL Server 2022 in Docker refuses strict connections - error 17821, "a valid TLS certificate is not
      # configured to accept strict", with a proper certificate too: microsoft/mssql-docker#878. So this step says
      # how it went without failing the job; the strict path is tested against the stand-in, tests/test_sql.fs.)
      - name: The client, TLS first (informational)
        if: always()
        continue-on-error: true
        env:
          SQL_HOST: localhost
          SQL_USER: sa
          SQL_DATABASE: stagingdb
          SQL_OTHER: proddb
          SQL_CA: /tmp/mssql/ca.pem
        run: SQL_PASSWORD="$SA_PASSWORD" build/clankforth $PWD/tests/sql/live.fs
      - name: The server's log, if a step failed
        if: failure()
        run: docker logs sql | tail -50

  # the container image (Dockerfile) builds, and the tool in it runs a script
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t clankforth .
      - name: Run it
        run: |
          docker run --rm clankforth --version
          printf 'USING: compression ;\n.( compressed: ) s" hello hello hello" gzip nip . cr bye\n' > /tmp/t.fs
          docker run --rm -v /tmp/t.fs:/app/t.fs clankforth /app/t.fs

