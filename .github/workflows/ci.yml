# The language's tests: a plain build, and one with the address and undefined-behaviour sanitizers
name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags: ["", "-fsanitize=address,undefined -fno-sanitize-recover=undefined"]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build
        run: cmake -S . -B build -G Ninja -DCMAKE_C_FLAGS="${{ matrix.flags }}" && ninja -C build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cd build && ctest --output-on-failure
